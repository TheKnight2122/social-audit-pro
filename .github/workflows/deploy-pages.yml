name: Publicar demostracion en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sap_fixture
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: sap_transfer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sap_fixture -d sap_transfer_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar pruebas automatizadas
        run: npm test

      - name: Verificar traslado en PostgreSQL real desechable
        run: npm run test:postgres
        env:
          POSTGRES_TEST_URL: postgresql://sap_fixture:disposable_ci_only@127.0.0.1:5432/sap_transfer_test

      - name: Verificar carga local con datos desechables
        run: npm run test:load -- 200 8

      - name: Generar demostracion estatica
        run: node scripts/build-static.js

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio generado
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
