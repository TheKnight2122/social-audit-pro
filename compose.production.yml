services:
  app:
    build: .
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:4173:4173"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4173
      APP_BASE_URL: ${APP_BASE_URL}
      DATABASE_PATH: /app/data/social-audit-pro.sqlite
      BACKUP_DIRECTORY: /app/backups
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-0}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      OPERATIONS_METRICS_TOKEN: ${OPERATIONS_METRICS_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-Social Audit Pro <no-reply@example.com>}
      TRUST_PROXY: "true"
      SYNC_WORKER_ENABLED: "true"
      SYNC_WORKER_POLL_MS: 60000
      SYNC_INTERVAL_MINUTES: 360
      META_CLIENT_ID: ${META_CLIENT_ID:-}
      META_CLIENT_SECRET: ${META_CLIENT_SECRET:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v26.0}
      INSTAGRAM_CLIENT_ID: ${INSTAGRAM_CLIENT_ID:-}
      INSTAGRAM_CLIENT_SECRET: ${INSTAGRAM_CLIENT_SECRET:-}
      INSTAGRAM_OAUTH_REDIRECT_URI: ${INSTAGRAM_OAUTH_REDIRECT_URI:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      FACEBOOK_OAUTH_REDIRECT_URI: ${FACEBOOK_OAUTH_REDIRECT_URI:-}
      TIKTOK_CLIENT_ID: ${TIKTOK_CLIENT_ID:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      TIKTOK_OAUTH_REDIRECT_URI: ${TIKTOK_OAUTH_REDIRECT_URI:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      LINKEDIN_OAUTH_REDIRECT_URI: ${LINKEDIN_OAUTH_REDIRECT_URI:-}
      LINKEDIN_API_VERSION: ${LINKEDIN_API_VERSION:-202606}
      YOUTUBE_OAUTH_CLIENT_ID: ${YOUTUBE_OAUTH_CLIENT_ID:-}
      YOUTUBE_OAUTH_CLIENT_SECRET: ${YOUTUBE_OAUTH_CLIENT_SECRET:-}
      YOUTUBE_OAUTH_REDIRECT_URI: ${YOUTUBE_OAUTH_REDIRECT_URI:-}
      X_CLIENT_ID: ${X_CLIENT_ID:-}
      X_CLIENT_SECRET: ${X_CLIENT_SECRET:-}
      X_OAUTH_REDIRECT_URI: ${X_OAUTH_REDIRECT_URI:-}
      X_API_BASE_URL: ${X_API_BASE_URL:-https://api.x.com}
    volumes:
      - social_audit_data:/app/data
      - social_audit_backups:/app/backups

volumes:
  social_audit_data:
  social_audit_backups:
